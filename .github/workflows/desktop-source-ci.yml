name: Cloud Agent Desktop source CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-agent-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/cloud-agent
          ref: main
          token: ${{ secrets.CLOUD_AGENT_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install the locked engine workspace
        working-directory: agent-engine
        run: pnpm install --frozen-lockfile

      - name: Build the desktop host dependencies
        working-directory: agent-engine
        run: pnpm run build:lib:host

      - name: Compile the desktop host and Cloud Agent overlay
        run: node scripts/prepare_desktop_build.mjs

      - name: Check the Electron entry syntax
        run: node --check client/entry.mjs

      - name: Run the focused Desktop locale checks
        working-directory: agent-engine
        run: pnpm exec vitest run apps/desktop/tests/locale.spec.ts --maxWorkers=1

      - name: Check Cloud Agent startup without DSH authentication
        working-directory: agent-engine
        run: >-
          pnpm exec vitest run apps/desktop/tests/main-startup.spec.ts
          -t "enters Cloud Agent workspace without DSH authentication"
          --maxWorkers=1

      - name: Run the Desktop renderer title checks
        working-directory: agent-engine
        run: >-
          pnpm exec vitest run
          apps/web/tests/desktop-boot.spec.ts
          packages/client/ui-layout/tests/app-frame.client.spec.tsx
          -t "forwards client initialization failures|uses the Desktop product title ahead of the client build title"
          --maxWorkers=1

      - name: Run the CUA Driver MCP lifecycle and composition checks
        working-directory: agent-engine
        run: >-
          pnpm exec vitest run
          packages/experimental/computer-use-cua-driver-mcp/tests/lifecycle.spec.ts
          packages/experimental/computer-use-cua-driver-mcp/tests/composition.spec.ts
          --maxWorkers=1
