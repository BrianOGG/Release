name: Publish Cloud Agent Desktop macOS OTA release

on:
  repository_dispatch:
    types: [cloud-agent-desktop-macos-release]

permissions:
  actions: write
  contents: write

jobs:
  publish-desktop-macos-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ github.event.client_payload.version }}
      SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      ARTIFACT_URL: ${{ github.event.client_payload.artifact_url }}
      ARTIFACT_DIGEST: ${{ github.event.client_payload.artifact_digest }}
      ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
    steps:
      - name: Download and verify the signed Release Actions artifact
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$ARTIFACT_URL"

          node - <<'NODE'
          const url = new URL(process.env.ARTIFACT_URL)
          const host = url.hostname.toLowerCase()
          const allowed = host.endsWith('.blob.core.windows.net') || host.endsWith('.actions.githubusercontent.com')
          if (url.protocol !== 'https:' || url.username || url.password || !allowed) {
            throw new Error('artifact URL is not an HTTPS GitHub Actions artifact storage URL')
          }
          NODE

          incoming="$RUNNER_TEMP/cloud-agent-desktop-incoming"
          mkdir -m 700 -p "$incoming/files"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 600 \
            "$ARTIFACT_URL" -o "$incoming/actions-artifact.zip"
          actual_digest="sha256:$(sha256sum "$incoming/actions-artifact.zip" | awk '{print $1}')"
          if [[ "$actual_digest" != "$ARTIFACT_DIGEST" ]]; then
            echo 'Actions artifact digest does not match the authenticated artifact metadata' >&2
            exit 1
          fi
          unzip -q "$incoming/actions-artifact.zip" -d "$incoming/files"

          archive_name="Cloud-Agent-DSH-${PACKAGE_VERSION}-mac-arm64.zip"
          manifest_name="Cloud-Agent-DSH-${PACKAGE_VERSION}-mac-arm64.json"
          archive="$incoming/files/$archive_name"
          metadata="$incoming/files/nightly-mac.yml"
          manifest="$incoming/files/$manifest_name"
          test -s "$archive"
          test -s "$metadata"
          test -s "$manifest"
          unzip -tq "$archive"
          unzip -Z1 "$archive" | grep -Fxq 'Cloud Agent DSH.app/Contents/Info.plist'

          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_sha512="$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          metadata_sha256="$(sha256sum "$metadata" | awk '{print $1}')"
          archive_size="$(stat -c '%s' "$archive")"
          VERSION="$PACKAGE_VERSION" SOURCE_SHA="$SOURCE_SHA" SOURCE_RUN_ID="$SOURCE_RUN_ID" \
          ARCHIVE_NAME="$archive_name" ARCHIVE_SHA256="$archive_sha256" ARCHIVE_SHA512="$archive_sha512" \
          ARCHIVE_SIZE="$archive_size" METADATA_SHA256="$metadata_sha256" \
          ARCHIVE="$archive" METADATA="$metadata" MANIFEST="$manifest" node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'))
          const feed = JSON.parse(fs.readFileSync(process.env.METADATA, 'utf8'))
          const expected = {
            schemaVersion: 1,
            kind: 'cloud-agent-desktop-ota-release',
            product: 'Cloud Agent DSH',
            version: process.env.VERSION,
            sourceCommit: process.env.SOURCE_SHA.toLowerCase(),
            platform: 'macOS',
            architecture: 'arm64',
            bundleIdentifier: 'com.brian.cloudagent',
            teamIdentifier: 'G24TAJV3LC',
          }
          for (const [key, value] of Object.entries(expected)) {
            const actual = key === 'sourceCommit' ? String(manifest[key]).toLowerCase() : manifest[key]
            if (actual !== value) throw new Error(`release manifest ${key} mismatch`)
          }
          if (manifest.artifact.filename !== process.env.ARCHIVE_NAME
            || manifest.artifact.sizeBytes !== Number(process.env.ARCHIVE_SIZE)
            || manifest.artifact.sha256 !== process.env.ARCHIVE_SHA256
            || manifest.artifact.sha512 !== process.env.ARCHIVE_SHA512) {
            throw new Error('release manifest does not match the macOS ZIP')
          }
          if (manifest.update.channel !== 'nightly'
            || manifest.update.feedUrl !== 'https://github.com/BrianOGG/Release/releases/latest/download/'
            || manifest.update.metadata !== 'nightly-mac.yml'
            || manifest.update.metadataSha256 !== process.env.METADATA_SHA256) {
            throw new Error('release manifest does not match the updater feed')
          }
          if (manifest.distribution.notarized !== false) throw new Error('unexpected notarization state for the current controlled-release workflow')
          if (feed.version !== process.env.VERSION || feed.path !== process.env.ARCHIVE_NAME
            || feed.files?.[0]?.url !== process.env.ARCHIVE_NAME
            || feed.files?.[0]?.size !== Number(process.env.ARCHIVE_SIZE)
            || feed.files?.[0]?.sha512 !== process.env.ARCHIVE_SHA512) {
            throw new Error('electron-updater metadata does not match the macOS ZIP')
          }
          console.log(JSON.stringify({ version: feed.version, sourceCommit: manifest.sourceCommit, teamIdentifier: manifest.teamIdentifier }))
          NODE

      - name: Publish the validated assets through the default OTA feed
        run: |
          set -euo pipefail
          release_tag="v${PACKAGE_VERSION}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $release_tag" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "tag already exists without a fresh release: $release_tag" >&2
            exit 1
          fi

          incoming="$RUNNER_TEMP/cloud-agent-desktop-incoming/files"
          archive="$incoming/Cloud-Agent-DSH-${PACKAGE_VERSION}-mac-arm64.zip"
          metadata="$incoming/nightly-mac.yml"
          manifest="$incoming/Cloud-Agent-DSH-${PACKAGE_VERSION}-mac-arm64.json"
          notes="Cloud Agent DSH macOS arm64 OTA release built from private source commit ${SOURCE_SHA}. GitHub Actions build run: https://github.com/BrianOGG/Release/actions/runs/${SOURCE_RUN_ID}"
          gh release create "$release_tag" "$archive" "$metadata" "$manifest" \
            --repo "$GITHUB_REPOSITORY" --title "Cloud Agent DSH ${PACKAGE_VERSION}" \
            --notes "$notes" --target main --draft
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false

          public_dir="$RUNNER_TEMP/cloud-agent-desktop-public-assets"
          mkdir -m 700 -p "$public_dir"
          validate_public_assets() {
            for asset in "$(basename "$archive")" nightly-mac.yml "$(basename "$manifest")"; do
              local_path="$public_dir/$asset"
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 600 \
                "https://github.com/BrianOGG/Release/releases/download/${release_tag}/${asset}" -o "$local_path"
            done
            cmp -s "$archive" "$public_dir/$(basename "$archive")"
            cmp -s "$metadata" "$public_dir/nightly-mac.yml"
            cmp -s "$manifest" "$public_dir/$(basename "$manifest")"
            [[ "$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              'https://api.github.com/repos/BrianOGG/Release/releases/latest' | jq -r '.tag_name')" == "$release_tag" ]]
          }
          if ! validate_public_assets; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft
            echo 'Public assets failed verification; release returned to draft.' >&2
            exit 1
          fi
          echo "Published and verified ${release_tag}; latest/download now contains the macOS arm64 OTA feed."

      - name: Delete the source Actions artifact after verified release
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Source Actions artifact ID is missing or invalid; skipping cleanup."
            exit 0
          fi
          if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"; then
            echo "Deleted source Actions artifact $ARTIFACT_ID"
          else
            echo "::warning::Could not delete source Actions artifact $ARTIFACT_ID; the verified Release remains available."
          fi
